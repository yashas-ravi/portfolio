name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # Speeds up builds by caching node_modules

      - name: Install Dependencies
        run: npm install

      - name: Build SolidJS App
        run: npm run build
        env:
          VITE_WEB3FORMS: ${{ secrets.VITE_WEB3FORMS }} # Injects the secret during build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: 'github-pages'
          path: './dist' # SolidJS/Vite outputs to 'dist', not 'build'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: 'github-pages'
